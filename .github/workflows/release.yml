on:
  push:
    tags:
      - '*'
  workflow_call:
    inputs:
      tag:
        type: string
permissions:
  contents: write
  packages: write
name: Release
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container: ghcr.io/sergeymakinen/ci:debian
    steps:
      - name: Release
        uses: sergeymakinen/ci/release@main
        with:
          tag: ${{ inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare artifacts for Docker
        run: |
          mkdir -p dist/docker
          mv dist/clamav_exporter_linux_s390x dist/docker/clamav_exporter_linux_s390x
          mv dist/clamav_exporter_linux_amd64_v1 dist/docker/clamav_exporter_linux_amd64
          mv dist/clamav_exporter_linux_arm_7 dist/docker/clamav_exporter_linux_arm
          mv dist/clamav_exporter_linux_arm64_v8.0 dist/docker/clamav_exporter_linux_arm64
          mv dist/clamav_exporter_linux_ppc64le_power8 dist/docker/clamav_exporter_linux_ppc64le
      - name: Upload binaries for Docker
        uses: actions/upload-artifact@v7
        with:
          name: docker-dist
          path: dist/docker

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: '${{ inputs.tag }}'
          fetch-depth: 0
      - name: Install QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: docker-dist
          path: dist/docker
      - name: Make binaries executable
        run: find dist/docker -type f -name clamav_exporter -exec chmod +x {} \;
      - name: Set up Docker Build Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{raw}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          tags: ${{ steps.meta.outputs.tags }}
